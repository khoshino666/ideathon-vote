<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイデアソン投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 白壁と松の緑、優勝だけ金。1カラムの進行表：投票 → 結果 → 進行役パネル */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1c2925; --muted:#5b6a64; --line:#d3dad5;
  --accent:#1f5a48; --accent-ink:#ffffff; --accent-soft:#e3eee9;
  --gold:#a87a1c; --gold-soft:#f6ecd2; --warn:#a4432c;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111916; --surface:#1a2521; --ink:#e7eee9; --muted:#9aaaa3; --line:#2f3e38;
    --accent:#72c4a5; --accent-ink:#0c1512; --accent-soft:#1f332c;
    --gold:#e2b95c; --gold-soft:#33290f; --warn:#e58a72;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111916; --surface:#1a2521; --ink:#e7eee9; --muted:#9aaaa3; --line:#2f3e38;
  --accent:#72c4a5; --accent-ink:#0c1512; --accent-soft:#1f332c;
  --gold:#e2b95c; --gold-soft:#33290f; --warn:#e58a72;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5.2vw,2.1rem);line-height:1.35}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.9rem;font-weight:700;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.head{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.head-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.org{font-size:.85rem;font-weight:700;letter-spacing:.08em}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.82rem;font-weight:700;background:var(--surface)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.open{border-color:var(--accent);color:var(--accent)}
.pill.open::before{background:var(--accent)}
.pill.revealed{border-color:var(--gold);color:var(--gold)}
.pill.revealed::before{background:var(--gold)}
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.note.warn{border-left-color:var(--warn)}
.teams{display:flex;flex-direction:column;gap:10px}
.team{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-height:64px}
.team:hover:not(:disabled){border-color:var(--accent)}
.team[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.team:disabled{cursor:default;opacity:.6}
.team.static,.team.static:hover{cursor:default;border-color:var(--line)}
.team .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.team[aria-checked="true"] .mark{border-color:var(--accent)}
.team[aria-checked="true"] .mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.team .body{display:flex;flex-direction:column;min-width:0;flex:1}
.team .name{font-weight:700}
.team .idea{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.tag{flex:none;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;min-width:0}
button.btn{font:inherit;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;min-height:42px;cursor:pointer}
button.btn:hover:not(:disabled){border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:12px 20px;font-size:1.02rem;width:100%}
button.danger{color:var(--warn);border-color:var(--warn)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.winner{background:var(--gold-soft);border:2px solid var(--gold);border-radius:var(--r);padding:18px 18px 20px;display:flex;flex-direction:column;gap:4px}
.winner .cap{font-size:.82rem;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.winner .who{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.3}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.bar-top .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-name{font-weight:700;overflow-wrap:anywhere}
.bar-name small{font-weight:400;color:var(--muted);margin-left:8px}
.track{height:14px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}
.bar-row.top .fill{background:var(--gold)}
.bar-row.top .track{background:var(--gold-soft)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
.pill.open::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.winner.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.7);color:var(--accent)}100%{transform:scale(1)}}
.stepper output.bump{animation:bump .35s ease}
.stage{display:flex;flex-direction:column;gap:14px}
.stage .cap{text-align:center;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.countdown{font-family:var(--display);font-weight:800;font-size:clamp(5rem,30vw,11rem);line-height:1;text-align:center;padding:16px 0 28px;color:var(--accent);font-variant-numeric:tabular-nums}
.countdown.tick{animation:pop .5s ease}
.race .track{height:24px}
.race .fill{transition:none}
.race .bar-top .n{font-size:1.2rem}
.bar-row.lead .fill{background:var(--gold)}
.bar-row.lead .track{background:var(--gold-soft)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
@media (prefers-reduced-motion: reduce){.fill{transition:none}.pill.open::before,.winner.pop,.stepper output.bump,.countdown.tick{animation:none}}
.admin{border:1.5px dashed var(--muted);border-radius:var(--r);padding:18px 16px;gap:22px}
.admin .block{display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{padding:8px 4px;font-size:.88rem}
.steps button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px}
.tally{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tally .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:42px;padding:0;font-size:1.2rem}
.stepper output{width:2.4em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent);flex:none}
@media (max-width:440px){
  .ed-row{grid-template-columns:minmax(0,1fr) auto}
  .ed-row input:nth-child(2){grid-column:1 / -1;grid-row:2}
  .steps{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<main>
  <header class="head">
    <div class="head-top"><span class="org">アンコモンズ アイデアソン</span><span id="phase" class="pill">読み込み中</span></div>
    <h1 id="theme">和歌山城を日本一集客できる城にするには？</h1>
    <p class="muted" id="lead">各班の発表を聞いて、いちばん良いと思った班に1人1票。挙手で投票し、進行役が集計します。</p>
  </header>
  <div id="status"></div>
  <section aria-labelledby="h-ballot"><div class="sec-head"><h2 id="h-ballot">班とアイデア</h2><span class="muted" id="count"></span></div><div id="ballot"><p class="muted">班の一覧を読み込んでいます…</p></div></section>
  <section aria-labelledby="h-result"><h2 id="h-result">結果</h2><div id="result"><p class="muted">結果は発表までお待ちください。</p></div></section>
  <section class="admin" id="admin" hidden aria-labelledby="h-admin">
    <div><h2 id="h-admin">進行役パネル</h2><p class="muted">入力した内容はこの端末のブラウザに保存されます。ほかの端末とは同期しません。<span id="save"></span></p></div>
    <div class="block"><h3>1. 進行</h3><div id="a-phase"></div><div id="a-sound"></div></div>
    <div class="block"><h3>2. 班とアイデア名</h3><div id="a-teams" class="block"></div><div><button class="btn" id="add-team" type="button">班を追加</button></div></div>
    <div class="block"><h3>3. 票の入力（挙手や紙の票を数えて入れる）</h3><div id="a-manual" class="block"></div></div>
    <div class="block"><h3>4. やり直し</h3><div id="a-reset"></div></div>
  </section>
</main>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function h(tag,props){
  var e=document.createElement(tag),k,v;
  if(props){for(k in props){v=props[k];
    if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(k==="value")e.value=v;
    else if(k==="checked"||k==="disabled"||k==="selected")e[k]=true;
    else e.setAttribute(k,v);
  }}
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null||c===false)continue;
    if(Array.isArray(c)){c.forEach(function(x){if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)));});}
    else e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return e;
}
var sigs={};
function paint(id,sig,build){
  sig=JSON.stringify(sig);
  if(sigs[id]===sig)return;
  sigs[id]=sig;
  var el=$(id),out=build();
  el.replaceChildren.apply(el,[].concat(out).filter(Boolean));
}

var PHASES=[["setup","準備中"],["open","投票受付中"],["closed","投票締切"],["revealed","結果発表"]];
var DEFAULT_THEME="和歌山城を日本一集客できる城にするには？";
var S={db:null,uid:null,isAdmin:false,canWrite:null,refused:false,cfg:null,cfgLoaded:false,votes:[],
  selected:null,myTeam:null,busy:false,msg:"",showLive:false,dirty:false,rev:0,saveErr:false,
  confirmReset:false,sound:true,anim:null,pop:false,bump:"",prevPhase:null,slow:false,unavailable:false,error:false};
try{S.myTeam=localStorage.getItem("ideathon-my-team")||null;}catch(e){}

function str(v,max){return typeof v==="string"?v.slice(0,max):"";}
function normalize(d){
  d=JSON.parse(JSON.stringify(d||{}));
  var teams=Array.isArray(d.teams)?d.teams:[];
  var manual={},m=d.manual&&typeof d.manual==="object"?d.manual:{};
  teams=teams.filter(function(t){return t&&typeof t.id==="string";}).map(function(t){
    var n=Math.floor(Number(m[t.id]));
    manual[t.id]=n>0?n:0;
    return {id:t.id,name:str(t.name,40),idea:str(t.idea,80)};
  });
  return {theme:str(d.theme,120)||DEFAULT_THEME,teams:teams,manual:manual,
    phase:PHASES.some(function(p){return p[0]===d.phase;})?d.phase:"setup",
    round:Number.isFinite(d.round)?d.round:1,banOwnTeam:d.banOwnTeam!==false};
}
function defaultCfg(){
  var teams=[];for(var i=1;i<=6;i++)teams.push({id:"t"+i,name:i+"班",idea:""});
  return normalize({teams:teams,phase:"setup",round:1,banOwnTeam:true});
}
function tally(){
  var c={},cfg=S.cfg,app=0;
  cfg.teams.forEach(function(t){c[t.id]=0;});
  S.votes.forEach(function(v){
    if(v.round!==cfg.round||!(v.pick in c))return;
    if(cfg.banOwnTeam&&v.myTeam&&v.myTeam===v.pick)return;
    c[v.pick]++;app++;
  });
  var total=app;
  cfg.teams.forEach(function(t){c[t.id]+=cfg.manual[t.id]||0;total+=cfg.manual[t.id]||0;});
  return {counts:c,total:total};
}
function myVote(){
  if(!S.uid||!S.cfg)return null;
  for(var i=0;i<S.votes.length;i++){var v=S.votes[i];if(v.id===S.uid&&v.round===S.cfg.round)return v;}
  return null;
}
function teamById(id){return S.cfg.teams.filter(function(t){return t.id===id;})[0]||null;}
function label(t){return t.name||"（班名なし）";}

/* ---------- 保存（進行役） ---------- */
var saveTimer=null,chain=Promise.resolve();
function touch(now){
  S.dirty=true;S.rev++;clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,now?0:400);
  render();
}
var KEY="ideathon-vote-config";
function flush(){
  var rev=S.rev;
  try{localStorage.setItem(KEY,JSON.stringify(S.cfg));S.saveErr=false;}catch(e){S.saveErr=true;}
  if(S.rev===rev)S.dirty=false;
  render();
}

/* ---------- 投票 ---------- */
function castVote(){
  if(!S.selected||S.busy)return;
  var pick=S.selected;S.busy=true;S.msg="";render();
  S.db.doc("votes/"+S.uid).set({pick:pick,myTeam:S.myTeam||null,round:S.cfg.round,at:Date.now()})
    .then(function(){S.selected=null;},function(e){
      if(e&&e.code==="invalid_argument")S.refused=true;
      else S.msg="投票を保存できませんでした。通信状況を確認して、もう一度押してください。";
    }).then(function(){S.busy=false;render();});
}

/* ---------- 発表の演出 ---------- */
var reduced=false;try{reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
var AC=null;
function ac(){
  if(!S.sound)return null;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}catch(e){return null;}
}
function drum(sec){
  var c=ac();if(!c)return;
  try{
    var len=Math.floor(c.sampleRate*0.05),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0),i;
    for(i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var t=c.currentTime+0.05;
    for(var k=0;k<sec;k+=0.07){
      var src=c.createBufferSource(),g=c.createGain();
      src.buffer=buf;g.gain.value=0.04+0.14*(k/sec);src.connect(g);g.connect(c.destination);src.start(t+k);
    }
  }catch(e){}
}
function fanfare(){
  var c=ac();if(!c)return;
  try{
    [[523.25,0],[659.25,.15],[783.99,.3],[1046.5,.45],[1318.5,.45]].forEach(function(p){
      var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+p[1];
      o.type="triangle";o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.5);
    });
  }catch(e){}
}
function confetti(){
  if(reduced)return;
  var old=$("confetti");if(old)old.remove();
  var cv=document.createElement("canvas");cv.id="confetti";document.body.append(cv);
  var x=cv.getContext("2d"),W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
  var cs=getComputedStyle(document.documentElement);
  var cols=["--gold","--accent","--warn","--ink"].map(function(k){return cs.getPropertyValue(k).trim()||"#a87a1c";});
  var ps=[],i;
  for(i=0;i<170;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:6+Math.random()*9,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  var t0=performance.now();
  function f(now){
    var el=now-t0;x.clearRect(0,0,W,H);
    ps.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/5500);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();
    });
    if(el<5500)requestAnimationFrame(f);else cv.remove();
  }
  requestAnimationFrame(f);
}
function startReveal(){
  if(S.anim||!S.cfg||reduced)return;
  var T=tally(),rows=S.cfg.teams.map(function(t){return {t:t,n:T.counts[t.id]};});
  var max=rows.reduce(function(m,r){return Math.max(m,r.n);},0);
  if(max<=0)return;
  var a=S.anim={id:Date.now(),stage:"count",rows:rows,max:max,D:Math.min(9000,3500+max*350)};
  S.pop=false;
  drum(2.7+a.D/1000+0.5);
  render();
  var n=3;
  (function tick(){
    if(S.anim!==a)return;
    if(n===0){a.stage="race";render();race(a);return;}
    var el=$("cd");
    if(el){el.textContent=String(n);el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick");}
    n--;setTimeout(tick,900);
  })();
}
function race(a){
  var t0=performance.now();
  function frame(now){
    if(S.anim!==a)return;
    var x=Math.min(1,(now-t0)/a.D),v=(1-Math.pow(1-x,2.2))*a.max;
    a.rows.forEach(function(r,i){
      var f=$("rf"+i),n=$("rn"+i);if(!f||!n)return;
      var d=Math.min(r.n,v);
      f.style.width=(d/a.max*100)+"%";
      n.textContent=(x>=1?r.n:Math.floor(d))+"票";
      f.parentNode.parentNode.classList.toggle("lead",x>0.55&&r.n>=v);
    });
    if(x<1)requestAnimationFrame(frame);
    else setTimeout(function(){if(S.anim!==a)return;S.anim=null;S.pop=true;render();confetti();fanfare();},800);
  }
  requestAnimationFrame(frame);
}

/* ---------- 描画 ---------- */
function render(){
  var cfg=S.cfg;
  var ph=cfg?cfg.phase:null,phName=ph?PHASES.filter(function(p){return p[0]===ph;})[0][1]:(S.cfgLoaded?"未設定":"読み込み中");
  var pill=$("phase");pill.textContent=phName;pill.className="pill"+(ph?" "+ph:"");
  $("theme").textContent=cfg?cfg.theme:DEFAULT_THEME;

  paint("status",[S.unavailable,S.error,S.slow,S.saveErr],function(){
    if(S.unavailable)return h("p",{class:"note warn",text:"投票データに接続できません。進行役のアカウントでClaudeにサインインして、このページを開き直してください。"});
    if(S.error)return h("p",{class:"note warn",text:"投票データの読み込みが止まりました。ページを開き直してください。"});
    if(S.slow)return h("p",{class:"note warn",text:"投票データにまだ接続できていません。表示が古い可能性があります。通信状況を確認してください。"});
    if(S.saveErr)return h("p",{class:"note warn",text:"この端末に保存できませんでした。ブラウザのプライベートモードを解除して開き直してください。"});
    return null;
  });

  if(!cfg){
    paint("ballot",[S.cfgLoaded,S.isAdmin,S.unavailable],function(){
      if(S.unavailable)return h("p",{class:"muted",text:"班の一覧を表示できません。"});
      if(!S.cfgLoaded)return h("p",{class:"muted",text:"班の一覧を読み込んでいます…"});
      if(S.isAdmin)return h("div",{class:"note"},h("p",{text:"まだ班が登録されていません。"}),
        h("div",{class:"row",style:"margin-top:8px"},h("button",{class:"btn",type:"button",text:"1班〜6班で初期設定を作る",onclick:function(){S.cfg=defaultCfg();touch(true);}})));
      return h("p",{class:"muted",text:"進行役が準備中です。しばらくお待ちください。"});
    });
    $("admin").hidden=true;
    return;
  }

  var prevPh=S.prevPhase;S.prevPhase=ph;
  if(ph!=="revealed"&&S.anim)S.anim=null;
  if(prevPh&&prevPh!=="revealed"&&ph==="revealed"){startReveal();if(S.anim)return;}
  var T=tally(),mine=myVote();
  if(mine&&mine.myTeam&&!S.myTeam)S.myTeam=mine.myTeam;
  if(S.myTeam&&!teamById(S.myTeam))S.myTeam=null;
  if(S.selected&&!teamById(S.selected))S.selected=null;
  var canVote=!!S.uid&&S.canWrite!==false&&!S.refused;
  var open=ph==="open";
  var current=S.selected||(mine&&teamById(mine.pick)?mine.pick:null);
  $("count").textContent=ph==="setup"?"":"投票数 "+T.total+"票";

  paint("ballot",[cfg.teams,ph],function(){
    var out=[];
    if(ph==="setup")out.push(h("p",{class:"note",text:"全チームの発表が終わると投票が始まります。"}));
    else if(ph==="open")out.push(h("p",{class:"note",text:"投票受付中です。進行役が班を順に読み上げます。いちばん良いと思った班で、1回だけ手を挙げてください。自分の班には挙げられません。"}));
    else if(ph==="closed")out.push(h("p",{class:"note",text:"投票は締め切りました。まもなく結果を発表します。"}));
    out.push(h("div",{class:"teams"},cfg.teams.map(function(t){
      return h("div",{class:"team static"},h("span",{class:"body"},h("span",{class:"name",text:label(t)}),t.idea?h("span",{class:"idea",text:t.idea}):null));
    })));
    return out;
  });

  var show=ph==="revealed"||(S.isAdmin&&S.showLive);
  paint("result",[ph,show,S.isAdmin,S.showLive,show?T:T.total,show?cfg.teams:0,S.anim&&[S.anim.id,S.anim.stage],S.pop],function(){
    var out=[];
    if(S.anim&&S.anim.stage==="count")return h("div",{class:"stage"},h("p",{class:"cap",text:"結果発表まで"}),h("div",{class:"countdown tick",id:"cd",text:"3"}));
    if(S.anim)return h("div",{class:"stage race"},h("p",{class:"cap",text:"開票中…"}),h("div",{class:"bars"},S.anim.rows.map(function(r,i){
      return h("div",{class:"bar-row"},
        h("div",{class:"bar-top"},h("span",{class:"bar-name"},label(r.t),r.t.idea?h("small",{text:r.t.idea}):null),h("span",{class:"n",id:"rn"+i,text:"0票"})),
        h("div",{class:"track"},h("div",{class:"fill",id:"rf"+i,style:"width:0%"})));
    })));
    if(S.isAdmin&&ph!=="revealed"){
      out.push(h("label",{class:"check",for:"live"},h("input",{type:"checkbox",id:"live",checked:S.showLive,onchange:function(e){S.showLive=e.target.checked;render();}}),
        h("span",null,"途中経過をこの画面に表示する",h("br"),h("span",{class:"muted",text:"スクリーンに映しているときは外しておくと、発表まで順位が見えません。"}))));
    }
    if(!show){
      out.push(h("p",{class:"muted",text:ph==="setup"?"投票が始まると、ここに結果が出ます。":"結果は発表までお待ちください。"}));
      return out;
    }
    var rows=cfg.teams.map(function(t){return {t:t,n:T.counts[t.id]};}).sort(function(a,b){return b.n-a.n;});
    var max=rows.length?rows[0].n:0;
    var tops=max>0?rows.filter(function(r){return r.n===max;}):[];
    if(ph==="revealed"){
      if(!tops.length)out.push(h("p",{class:"note",text:"まだ票が入っていません。"}));
      else out.push(h("div",{class:"winner"+(S.pop?" pop":"")},
        h("span",{class:"cap",text:tops.length>1?"同率1位":"優勝"}),
        h("span",{class:"who",text:tops.map(function(r){return label(r.t);}).join("・")}),
        tops.length===1&&tops[0].t.idea?h("span",{text:tops[0].t.idea}):null,
        h("span",{class:"muted",text:max+"票 / 全"+T.total+"票"})));
    }
    out.push(h("div",{class:"bars"},rows.map(function(r){
      var fill=h("div",{class:"fill"});fill.style.width=(max?r.n/max*100:0)+"%";
      return h("div",{class:"bar-row"+(max>0&&r.n===max?" top":"")},
        h("div",{class:"bar-top"},h("span",{class:"bar-name"},label(r.t),r.t.idea?h("small",{text:r.t.idea}):null),h("span",{class:"n",text:r.n+"票"})),
        h("div",{class:"track"},fill));
    })));
    if(S.isAdmin&&ph==="revealed"&&tops.length&&!reduced)out.push(h("div",{class:"row"},h("button",{class:"btn",type:"button",text:"発表の演出をもう一度",onclick:startReveal})));
    return out;
  });

  $("admin").hidden=!S.isAdmin;
  if(S.isAdmin)renderAdmin(T);
}

function renderAdmin(T){
  var cfg=S.cfg;
  $("save").textContent=S.dirty?" 保存中…":"";
  paint("a-phase",[cfg.phase],function(){
    var hint={setup:"班名とアイデア名を整えたら「投票受付中」に進めます。",open:"班を順に読み上げて挙手を数え、下の「票の入力」に入れます。入れ終えたら「投票締切」へ。",
      closed:"票の入力を確かめてください。「結果発表」を押すと、カウントダウンと開票レースのあとに優勝チームが出ます。",revealed:"結果を表示しています。"}[cfg.phase];
    return [h("div",{class:"steps"},PHASES.map(function(p){
      return h("button",{class:"btn",type:"button","aria-pressed":cfg.phase===p[0]?"true":"false",text:p[1],onclick:function(){if(cfg.phase!==p[0]){S.cfg.phase=p[0];touch(true);}}});
    })),h("p",{class:"muted",style:"margin-top:8px",text:hint})];
  });

  paint("a-sound",[S.sound],function(){
    return h("label",{class:"check",for:"sound",style:"margin-top:4px"},h("input",{type:"checkbox",id:"sound",checked:S.sound,onchange:function(e){S.sound=e.target.checked;render();}}),
      h("span",{text:"結果発表でドラムロールとファンファーレを鳴らす（このパソコンから音が出ます）"}));
  });

  var ed=$("a-teams"),sig=cfg.teams.map(function(t){return t.id;}).join(",")+"|"+(cfg.phase==="setup");
  if(sigs.editor!==sig){
    sigs.editor=sig;
    ed.replaceChildren.apply(ed,cfg.teams.map(function(t){
      function bind(key){return function(e){var x=teamById(t.id);if(x&&x[key]!==e.target.value){x[key]=e.target.value;touch();}};}
      return h("div",{class:"ed-row"},
        h("input",{type:"text",id:"name-"+t.id,"aria-label":"班名",placeholder:"班名",maxlength:"40",value:t.name,onchange:bind("name")}),
        h("input",{type:"text",id:"idea-"+t.id,"aria-label":"アイデア名",placeholder:"アイデア名（発表後に入力）",maxlength:"80",value:t.idea,onchange:bind("idea")}),
        h("button",{class:"btn",type:"button",text:"削除",disabled:cfg.phase!=="setup"||cfg.teams.length<=2,"aria-label":label(t)+"を削除",onclick:function(){
          S.cfg.teams=S.cfg.teams.filter(function(x){return x.id!==t.id;});delete S.cfg.manual[t.id];touch(true);}}));
    }));
  }else if(!S.dirty){
    cfg.teams.forEach(function(t){
      ["name","idea"].forEach(function(k){var i=$(k+"-"+t.id);if(i&&i!==document.activeElement&&i.value!==t[k])i.value=t[k];});
    });
  }

  paint("a-manual",[cfg.teams,cfg.manual,S.bump],function(){
    return cfg.teams.map(function(t){
      var n=cfg.manual[t.id]||0;
      function step(d){return function(){var v=Math.max(0,(S.cfg.manual[t.id]||0)+d);S.cfg.manual[t.id]=v;S.bump=t.id+":"+Date.now();touch();};}
      return h("div",{class:"tally"},h("span",{class:"name",text:label(t)}),
        h("div",{class:"stepper"},
          h("button",{class:"btn",type:"button",text:"−",disabled:n<=0,"aria-label":label(t)+"の票を1減らす",onclick:step(-1)}),
          h("output",{class:S.bump.indexOf(t.id+":")===0?"bump":null,text:String(n)}),
          h("button",{class:"btn",type:"button",text:"＋","aria-label":label(t)+"の票を1増やす",onclick:step(1)})));
    });
  });

  paint("a-reset",[S.confirmReset,T.total],function(){
    if(!S.confirmReset)return h("div",{class:"row"},h("button",{class:"btn danger",type:"button",text:"票をすべて消して準備中に戻す",onclick:function(){S.confirmReset=true;render();}}),
      h("span",{class:"muted",text:"リハーサル後に使います。班の設定は残ります。"}));
    return h("div",{class:"note warn"},h("p",{text:"現在の"+T.total+"票をすべて消します。元に戻せません。"}),
      h("div",{class:"row",style:"margin-top:8px"},
        h("button",{class:"btn danger",type:"button",text:"消してやり直す",onclick:function(){
          S.cfg.round=(S.cfg.round||1)+1;S.cfg.manual={};S.cfg.teams.forEach(function(t){S.cfg.manual[t.id]=0;});
          S.cfg.phase="setup";S.confirmReset=false;S.selected=null;touch(true);}}),
        h("button",{class:"btn",type:"button",text:"やめる",onclick:function(){S.confirmReset=false;render();}})));
  });
}

$("add-team").addEventListener("click",function(){
  if(!S.cfg||S.cfg.teams.length>=12)return;
  var id="t"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
  S.cfg.teams.push({id:id,name:(S.cfg.teams.length+1)+"班",idea:""});S.cfg.manual[id]=0;touch(true);
});

/* ---------- 接続 ---------- */
function init(){
  S.isAdmin=true;S.cfgLoaded=true;
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  S.cfg=saved?normalize(saved):defaultCfg();
  render();
  window.addEventListener("storage",function(e){
    if(e.key!==KEY||S.dirty||!e.newValue)return;
    try{S.cfg=normalize(JSON.parse(e.newValue));render();}catch(x){}
  });
}
init();
})();
</script>
</body>
</html>
